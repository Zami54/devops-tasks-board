# =============================================================
#  Cloisonnement réseau (Zero Trust à l'intérieur du cluster)
#
#  Par défaut, tous les pods d'un cluster peuvent se parler. Ici :
#   1. on interdit TOUT trafic entrant dans le namespace,
#   2. puis on n'ouvre que les trois flux nécessaires :
#        extérieur -> frontend:8080
#        frontend  -> backend:3000
#        backend   -> postgres:5432
#
#  Un frontend compromis ne peut donc pas atteindre la base directement.
#  Nécessite un plugin réseau qui applique les NetworkPolicies : c'est
#  pourquoi ./K8S-start.sh démarre Minikube avec --cni=calico.
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tasks-board
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-anywhere
  namespace: tasks-board
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-from-frontend
  namespace: tasks-board
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-backend
  namespace: tasks-board
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
          protocol: TCP
