apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tasks-board
  labels:
    app: backend
    app.kubernetes.io/part-of: tasks-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # utilisateur « node » de l'image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Version précise (pas « latest ») : on sait exactement ce qui tourne.
          image: tasks/backend:1.0.0
          # Never : l'image est construite dans le Docker interne de Minikube
          # et n'existe sur aucun registre.
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: PORT }
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef: { name: app-config, key: NODE_ENV }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DATABASE_URL }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # startup  : laisse jusqu'à 2 min pour démarrer (attente de la base).
          # liveness : le process répond-il ? Ne teste PAS la base, sinon une
          #            coupure de PostgreSQL ferait redémarrer l'API en boucle.
          # readiness: peut-il servir du trafic ? Teste la base ; si elle tombe,
          #            le pod sort du Service sans être tué.
          startupProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
