apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tasks-board
  labels:
    app: frontend
    app.kubernetes.io/part-of: tasks-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # utilisateur « nginx » de l'image unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: tasks/frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: BACKEND_URL }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Système de fichiers en lecture seule : nginx n'écrit que dans ces
          # deux dossiers en mémoire (configuration générée, fichiers temporaires).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: nginx-conf
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
